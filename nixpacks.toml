[
phases.setup
]
nixPkgs = ["php82", "php82Extensions.pdo_mysql", "php82Extensions.mbstring",
           "php82Extensions.xml", "php82Extensions.curl", "php82Extensions.zip",
           "php82Extensions.gd", "php82Extensions.tokenizer", "php82Extensions.bcmath",
           "nodejs_20", "composer"]

[
phases.install
]
cmds = [
    "composer install --no-dev --optimize-autoloader",
    "npm ci"
]

[
phases.build
]
cmds = ["npm run build"]